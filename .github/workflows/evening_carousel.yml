name: Daily Tamil Financial Carousel - Evening Edition (7:15 PM IST)
# Scheduled daily at 7:15 PM IST (13:45 UTC)

on:
  schedule:
    # 7:15 PM IST = 13:45 UTC every day (evening post-market edition)
    - cron: '45 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in Dry-Run mode (no live publishing)"
        type: boolean
        default: false
      query:
        description: "Optional custom market topic search query"
        type: string
        default: ""

concurrency:
  group: tamil-evening-carousel-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tamil-carousel-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Tamil Carousel Pipeline (Evening Edition - Direct Live Publish)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_INSTAGRAM: ${{ secrets.ENABLE_INSTAGRAM || 'true' }}
          ENABLE_FACEBOOK: ${{ secrets.ENABLE_FACEBOOK || 'true' }}
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'true' }}
        run: |
          EXTRA_ARGS="--edition evening"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ inputs.query }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --query '${{ inputs.query }}'"
          fi
          python engine.py $EXTRA_ARGS

      - name: Commit Deduplication Data & Unique Slides
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/used_carousel_topics.json state/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Tamil evening carousel slides, topic history, and master package [skip ci]"
            for i in {1..3}; do
              git pull origin master --rebase -X ours && git push origin master && break || sleep 3
            done
          fi

      - name: Prune Slide Images Older Than 48 Hours
        run: |
          find state/carousel_slides/ -name "*.png" -mtime +2 -delete || true
          git add -u state/carousel_slides/ || true
          git diff --staged --quiet || (git commit -m "chore: prune older Tamil carousel slides [skip ci]" && git push origin master)

      - name: Upload Tamil Carousel PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-debunk-tamil-carousel-pdf-evening
          path: state/latest_carousel.pdf
          if-no-files-found: warn

      - name: Upload Thinker Incident Report (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thinker-incident-report-evening
          path: state/thinker_incident_report.json
          if-no-files-found: ignore
