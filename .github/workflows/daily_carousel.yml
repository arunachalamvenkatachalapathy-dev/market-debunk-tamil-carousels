name: Daily Tamil Financial Carousel Pipeline (7:15 PM IST)
# Scheduled daily at 7:15 PM IST (13:45 UTC)

on:
  schedule:
    # 7:15 PM IST = 13:45 UTC every day (runs 15 mins after English)
    - cron: '45 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in Dry-Run mode (no live publishing)"
        type: boolean
        default: false
      draft_music:
        description: "Draft Music Option (Stage carousel to add Instagram trending music)"
        type: boolean
        default: false
      master_pkg_path:
        description: "Path to English master carousel package if available"
        type: string
        default: ""

concurrency:
  group: tamil-carousel-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tamil-carousel-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Download English Master Package
        id: download_master
        env:
          GH_TOKEN: ${{ secrets.ENGLISH_MASTER_READ_TOKEN || github.token }}
        run: |
          mkdir -p state
          echo "Attempting to fetch latest English master package..."
          gh run download --repo arunachalamvenkatachalapathy-dev/market-debunk-carousels \
            --name market-debunk-carousel-master --dir state/ || echo "No English package downloaded; will use standalone research."

      - name: Run Tamil Carousel Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_INSTAGRAM: ${{ secrets.ENABLE_INSTAGRAM || 'true' }}
          ENABLE_FACEBOOK: ${{ secrets.ENABLE_FACEBOOK || 'true' }}
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'true' }}
        run: |
          mkdir -p state
          echo "Fetching latest English master package from market-debunk-carousels..."
          curl -sSL "https://raw.githubusercontent.com/arunachalamvenkatachalapathy-dev/market-debunk-carousels/master/state/market_debunk_carousel_master.json" -o state/market_debunk_carousel_master.json || echo "Remote package fetch skipped."
          
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.draft_music }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --draft-music"
          fi
          if [ -s "state/market_debunk_carousel_master.json" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --master-pkg state/market_debunk_carousel_master.json"
          fi
          python engine.py $EXTRA_ARGS

      - name: Commit Deduplication Data & Unique Slides
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/used_carousel_topics.json state/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Tamil carousel slides, topic history, and master package [skip ci]"
            for i in {1..3}; do
              git pull origin master --rebase -X ours && git push origin master && break || sleep 3
            done
          fi

      - name: Prune Slide Images Older Than 48 Hours
        run: |
          find state/carousel_slides/ -name "*.png" -mtime +2 -delete || true
          git add -u state/carousel_slides/ || true
          git diff --staged --quiet || (git commit -m "chore: prune older Tamil carousel slides [skip ci]" && git push origin master)

      - name: Upload Tamil Carousel PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-debunk-tamil-carousel-pdf
          path: state/latest_carousel.pdf
          if-no-files-found: warn

      - name: Upload Thinker Incident Report (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thinker-incident-report
          path: state/thinker_incident_report.json
          if-no-files-found: ignore
